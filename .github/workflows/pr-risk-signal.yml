name: PR Risk Signal

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  analyze-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR Risk Signal
        uses: ./
        with:
          api-url: ${{ vars.PR_RISK_API_URL }}
          api-key: ${{ secrets.PR_RISK_API_KEY }}